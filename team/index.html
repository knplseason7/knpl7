<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<title>KNPL-7 Team Desk | Kerala Namboodiris Premier League</title>
<meta name="description" content="KNPL-7 franchises: upload fee receipts, download KNPL receipts, collect jersey details and request season replacements.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kerala Namboodiris Premier League · KNPL-7">
<meta property="og:title" content="KNPL-7 Team Desk">
<meta property="og:description" content="Fee receipts, jersey details and season replacements for KNPL-7 franchises. Log in with your Team Draft code.">
<meta property="og:url" content="https://knplseason7.github.io/knpl7/team/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&family=Public+Sans:wght@400;500;600;700&family=Noto+Sans+Malayalam:wght@400;600;700&display=swap">
<link rel="stylesheet" href="desk.css?v=18">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="receipt.js?v=5" defer></script>
<script src="common.js?v=4"></script>
</head>
<body>
<header><div class="wrap"><img class="hlogo" src="a/knpl.png" alt="KNPL"><div class="sp"><div class="kick">KNPL-7 · <span data-t="franchises"></span></div><h1>Team Desk</h1><div class="tagline" data-t="tagline"></div></div>
  <div class="lang" role="group" aria-label="Language"><button data-l="en" aria-pressed="true">English</button><button data-l="ml" aria-pressed="false">മലയാളം</button></div></div></header>
<main class="wrap">
<section id="gate" class="card gate">
  <h2 data-t="login"></h2>
  <p class="muted" data-th="loginNote"></p>
  <label class="fl" for="code" data-t="teamCode"></label>
  <input id="code" type="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="KD7-XXXX-XXXXXX">
  <div style="margin-top:12px"><button class="btn or" id="go" data-t="loginBtn"></button></div>
  <div class="msg err" id="gmsg" role="alert"></div>
</section>

<section id="app" hidden>
  <div class="teambar"><span id="tlogo"></span><div class="sp"><b id="tname"></b><span class="muted small" id="towner"></span></div><button class="btn ghost sm" id="out" data-t="logout"></button></div>
  <div class="tabs" role="tablist">
    <button role="tab" id="tb-live" aria-selected="false" class="livetab"><i class="ldot"></i><span data-t="tabLive"></span></button>
    <button role="tab" id="tb-pay" aria-selected="true" data-t="tabPay"></button>
    <button role="tab" id="tb-fix" aria-selected="false" data-t="tabFix"></button>
    <button role="tab" id="tb-jer" aria-selected="false" data-t="tabJer"></button>
    <button role="tab" id="tb-rep" aria-selected="false" data-t="tabRep"></button>
    <button role="tab" id="tb-spo" aria-selected="false" data-t="tabSpo"></button>
    <button role="tab" id="tb-help" aria-selected="false" data-t="tabHelp"></button>
  </div>

  <div id="pg-pay">
    <div class="card next" id="nextcard"></div>
    <div class="card">
      <h2 data-t="howTitle"></h2>
      <ol class="flow"><li><b>1</b><span data-t="ps1"></span></li><li><b>2</b><span data-t="ps2"></span></li><li><b>3</b><span data-t="ps3"></span></li><li><b>4</b><span data-t="ps4"></span></li></ol>
      <div class="payto"><span data-t="payTo"></span> <b id="payto"></b></div>
      <div class="warn"><b data-t="utrTitle"></b> <span data-t="utr2"></span>
        <details class="sample"><summary data-t="seeSample"></summary><div class="utrbox"><a href="a/sample-receipt.jpg" target="_blank" rel="noopener" class="sthumb"><img src="a/sample-receipt.jpg" alt="Sample payment receipt" loading="lazy"></a><div><p data-t="utr1"></p><p class="small muted" data-t="utr3"></p></div></div></details>
      </div>
      <div class="msg ok" id="pmsg" role="status"></div>
      <p class="small contact" data-ct="fees"></p>
    </div>
    <div class="sheet" id="formcard" hidden><div class="sheetbox" role="dialog" aria-modal="true" aria-labelledby="ftl">
      <div class="sheethead"><h2 id="ftl" data-t="formTitle"></h2><button class="x" id="fx" aria-label="Close">×</button></div>
      <label class="fl" for="fitem" data-t="fItem"></label><select id="fitem"></select>
      <p class="small muted" id="famt"></p>
      <label class="fl" for="ffile" data-t="fFile"></label><p class="small muted" style="margin:0 0 6px" data-t="ocrHint"></p>
      <label class="drop"><span data-t="fFileNote"></span><input id="ffile" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"></label>
      <div class="ocr" id="focr" hidden></div>
      <div class="cov" id="fcov" hidden></div>
      <div class="grid2">
        <div><label class="fl" for="fdate" data-t="fDate"></label><input id="fdate" type="date"></div>
        <div><label class="fl" for="fmode" data-t="fMode"></label><select id="fmode"></select></div>
        <div><label class="fl" for="futr" data-t="fUtr"></label><input id="futr" type="text" autocomplete="off" data-tp="fUtrPh"></div>
        <div><label class="fl" for="fpayer" data-t="fPayer"></label><input id="fpayer" type="text"></div>
      </div>
      <label class="fl" for="fnote" data-t="fNote"></label><textarea id="fnote" maxlength="300"></textarea>
      <label class="chk"><input type="checkbox" id="fack"><span data-t="fAck"></span></label>
      <div class="row"><button class="btn or" id="fsend" data-t="submit"></button><button class="btn ghost" id="fcancel" data-t="cancel"></button></div>
      <div class="msg" id="fmsg" role="status"></div>
    </div></div>
    <div class="card"><div class="cardhead"><h3 data-t="schedTitle"></h3><button class="btn or sm" id="upAny" data-t="uploadAny"></button></div><div class="sched" id="sched"></div>
      <details class="small" style="margin-top:10px"><summary data-t="draftBreak"></summary><table class="brk" id="dbrk"></table></details></div>
    <div class="card"><h3 data-t="histTitle"></h3><ul class="hist" id="hist"></ul></div>
  </div>

  <div id="pg-live" hidden>
    <div class="livebar">
      <div class="lvt"><b>TENVOX BIDCAST</b><span data-t="lvNote"></span></div>
      <div class="lvbtns"><button class="btn sm" id="lvCopy" data-t="copy"></button><a class="btn ok sm" id="lvWa" target="_blank" rel="noopener" data-t="lvShare"></a><a class="btn or sm" id="lvOpen" target="_blank" rel="noopener" data-t="lvOpen"></a></div>
    </div>
    <iframe id="livefr" title="TENVOX BIDCAST · KNPL-7 Mega Auction Live" loading="lazy" allow="autoplay; clipboard-write; fullscreen"></iframe>
  </div>

  <div id="pg-fix" hidden>
    <iframe id="fixfr" title="KNPL-7 Fixture & Ladder" loading="lazy" allow="clipboard-write"></iframe>
  </div>

  <div id="pg-jer" hidden>
    <div class="card">
      <h2 data-t="dsTitle"></h2>
      <div class="designs">
        <figure><figcaption data-t="dsApproved"></figcaption><a id="dsA" target="_blank" rel="noopener"><img id="dsAimg" alt="Approved design"></a><p class="small muted" id="dsAcol"></p></figure>
        <figure><figcaption data-t="dsFinal"></figcaption><div id="dsF" class="dsf"></div><p class="small muted" id="dsFnote"></p></figure>
      </div>
      <p class="small contact" data-ct="jersey"></p>
    </div>
    <div class="card">
      <h2 data-t="jerTitle"></h2>
      <p class="muted" data-t="jerIntro"></p>
      <div class="share">
        <h3 data-t="shareTitle"></h3>
        <p class="small" data-t="shareNote"></p>
        <div class="linkrow"><input id="jlink" type="text" readonly><button class="btn sm" id="jcopy" data-t="copy"></button><a class="btn ok sm" id="jwa" target="_blank" rel="noopener" data-t="shareWa"></a></div>
      </div>
      <ul class="dl"><li data-t="jd1"></li><li data-t="jd2"></li><li data-t="jd3"></li><li data-t="jd4"></li></ul>
    </div>
    <div class="card">
      <h3 data-t="jerList"></h3>
      <p class="small muted" data-t="jerListNote"></p>
      <div style="overflow-x:auto"><table class="jt"><thead><tr><th data-t="thPlayer"></th><th data-t="thSize"></th><th data-t="thSleeve"></th><th data-t="thName"></th><th data-t="thNo"></th><th data-t="thBack"></th></tr></thead><tbody id="jrows"></tbody></table></div>
      <div class="row"><button class="btn or" id="jsave" data-t="jSave"></button></div>
      <div class="msg" id="jmsg" role="status"></div>
    </div>
  </div>

  <div id="pg-rep" hidden>
    <div class="card">
      <h2 data-t="repTitle"></h2>
      <p class="small contact" data-ct="fees"></p>
      <ul class="dl"><li data-t="r1"></li><li data-t="r2"></li><li data-t="r3"></li><li data-t="r4"></li><li data-t="r5"></li></ul>
      <div class="note rnote"><b data-t="rnTitle"></b><ul class="dl"><li data-t="r6"></li><li data-t="r7"></li><li data-t="r8"></li></ul></div>
      <div id="repclosed" class="note"></div>
      <div id="repform" hidden>
        <div class="grid2">
          <div><label class="fl" for="rout" data-t="rOut"></label><select id="rout"></select></div>
          <div><label class="fl" for="rin" data-t="rIn"></label><select id="rin"></select></div>
        </div>
        <p class="small muted" id="rinfo"></p>
        <label class="chk"><input type="checkbox" id="ragree"><span data-t="rAgree"></span></label>
        <div class="row"><button class="btn or" id="rsend" data-t="rSubmit"></button></div>
        <div class="msg" id="rmsg" role="status"></div>
      </div>
    </div>
    <div class="card"><h3 data-t="rList"></h3><ul class="hist" id="rhist"></ul></div>
  </div>

  <div id="pg-spo" hidden>
    <div class="card target">
      <div class="kick2" data-t="tgKick"></div>
      <div class="tgrow"><div><span class="small muted" data-t="tgReceived"></span><div class="big2" id="tgGot">–</div></div><div class="r"><span class="small muted" data-t="tgTarget"></span><div class="big2" id="tgTarget">–</div></div></div>
      <div class="tbar"><i id="tgBar"></i><i class="w" id="tgWait"></i><span class="mk" id="mk15"><em>₹15,000</em></span></div>
      <div class="small muted" id="tgSplit"></div>
      <p class="cheer" id="tgCheer"></p>
      <div class="small" id="tgRank"></div>
    </div>
    <div class="card">
      <h3 data-t="shTitle"></h3>
      <p class="small muted" data-t="shNote"></p>
      <p class="small contact" data-ct="fund"></p>
      <div class="linkrow"><input id="spLink" type="text" readonly><button class="btn sm" id="spCopy" data-t="copy"></button></div>
      <label class="fl" for="spMsg" data-t="shMsg"></label>
      <textarea id="spMsg" style="min-height:190px;font-size:14px"></textarea>
      <div class="row"><a class="btn ok" id="spWa" target="_blank" rel="noopener" data-t="shWa"></a><button class="btn ghost" id="spMsgCopy" data-t="shCopyMsg"></button><a class="btn or" id="spOpen" target="_blank" rel="noopener" data-t="catOpenBtn"></a></div>
    </div>
    <div class="card">
      <div class="cardhead"><h3 data-t="avTitle"></h3><span class="small muted" id="spolive"></span></div>
      <div class="cats" id="cats"></div>
      <div id="avail"></div>
    </div>
    <div class="card">
      <h3 data-t="spoMine"></h3>
      <ul class="hist" id="spolist"></ul>
      <p class="small muted" data-t="spoRule"></p>
    </div>
    <div class="card">
      <h3 data-t="lbTitle"></h3>
      <p class="small muted" data-t="lbNote"></p>
      <ol class="lb" id="lb"></ol>
    </div>
  </div>

  <div id="pg-help" hidden>
    <div class="card">
      <h2 data-t="helpTitle"></h2>
      <p class="muted" data-t="helpIntro"></p>
      <div class="contacts" id="contacts"></div>
    </div>
  </div>
</section>
</main>
<footer data-t="footer2"></footer>
<script src="ocr.js?v=1"></script>
<script src="desk.js?v=26"></script>
</body></html>
