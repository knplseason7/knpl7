<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KNPL-7 Live Registration</title>
<meta property="og:title" content="KNPL-7 Live Registration Status"><meta property="og:description" content="Countdown and live registration count – KNPL Season 7 Phase 1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800&family=Public+Sans:wght@500;700&display=swap">
<style>
:root{--bg:#0b1a38;--gold:#ffb366;--acc:#ff9a3c;--soft:#cfdcf5}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:radial-gradient(circle at 50% 0%,#1d3a78 0%,#0b1a38 55%,#060f22 100%);color:#fff;font-family:'Public Sans',Arial,sans-serif;display:flex;justify-content:center;padding:24px 16px}
.w{width:100%;max-width:520px;text-align:center}
img.l{width:110px;height:110px;border-radius:50%;box-shadow:0 0 0 5px rgba(224,122,31,.4),0 0 36px rgba(255,160,60,.45)}
.k{margin-top:14px;font-size:13px;letter-spacing:3px;color:var(--gold);font-weight:700}
h1{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:40px;line-height:1.05;margin-top:4px}
.live{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;font-weight:700;letter-spacing:2px;color:#ff6b6b}
.live i{width:10px;height:10px;border-radius:50%;background:#ff4d4d;animation:p 1.4s infinite}
@keyframes p{0%{box-shadow:0 0 0 0 rgba(255,77,77,.7)}70%{box-shadow:0 0 0 10px rgba(255,77,77,0)}100%{box-shadow:0 0 0 0 rgba(255,77,77,0)}}
.card{margin-top:18px;background:rgba(255,255,255,.07);border:2px solid rgba(255,179,102,.5);border-radius:20px;padding:20px 16px}
.lab{font-size:15px;letter-spacing:2px;color:var(--gold);font-weight:700;text-transform:uppercase}
.cd{display:flex;justify-content:center;gap:10px;margin-top:12px}
.cd div{background:#1b3466;border-radius:14px;min-width:78px;padding:8px 6px}
.cd b{display:block;font-family:'Saira Condensed',sans-serif;font-size:52px;line-height:1}
.cd span{font-size:11px;letter-spacing:2px;color:var(--soft)}
.big{font-family:'Saira Condensed',sans-serif;font-weight:800;font-size:84px;line-height:1;margin-top:6px}
.big small{font-size:42px;color:var(--soft)}
.bar{height:16px;border-radius:10px;background:#1b3466;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e07a1f,#ff9a3c);transition:width .8s}
.sub{margin-top:10px;font-size:16px;color:var(--soft);line-height:1.45}
.sub b{color:#fff}
.btn{display:block;margin-top:18px;background:linear-gradient(90deg,#e07a1f,#ff9a3c);color:#fff;text-decoration:none;font-weight:700;font-size:19px;border-radius:14px;padding:14px}
.wins{margin-top:16px;text-align:left;font-size:14px;color:var(--soft)}
.wins div{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px solid rgba(255,255,255,.08)}
.wins .on{color:#fff;font-weight:700}.wins .on span:first-child::before{content:'● ';color:#3ddc84}
.ft{margin-top:14px;font-size:12px;color:#8ea2c8}
</style></head><body><div class="w">

<div class="k">KNPL SEASON 7 · PHASE 1</div>
<h1>PLAYER REGISTRATION</h1>
<div class="live"><i></i>LIVE</div>
<div class="card" id="cdCard" hidden><div class="lab" id="cdLab">Opens in</div>
<div class="cd"><div><b id="h">00</b><span>HRS</span></div><div><b id="m">00</b><span>MIN</span></div><div><b id="s">00</b><span>SEC</span></div></div></div>
<div class="card"><div class="lab">Players registered</div>
<div class="big"><span id="tot">–</span><small> / <span id="cap">250</span></small></div>
<div class="bar"><i id="bar"></i></div>
<div class="sub" id="sub">Connecting…</div></div>
<a class="btn" href="https://knplseason7.github.io/knpl7/">Register now →</a>
<div class="wins" id="wins"></div>
<div class="ft" id="ft">Updates automatically</div>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbxX7MQ9VkfZo7USkdxQzldaOVKIkE8hFiwe-xZsJl_ynAKcGBu8wRX6OmwMBTb22ARg/exec';
let st=null,off=0,last=0;
const $=id=>document.getElementById(id),p2=n=>String(n).padStart(2,'0');
const fmt=ms=>new Date(ms).toLocaleString('en-IN',{timeZone:'Asia/Kolkata',day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});
async function load(){
  try{const r=await fetch(API,{method:'POST',body:JSON.stringify({fn:'getStatus',args:[]}),redirect:'follow'});const j=await r.json();if(!j.ok)throw 0;
    st=j.result;off=(st.serverNow||st.now||Date.now())-Date.now();last=Date.now();render();$('ft').textContent='Updated '+new Date().toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit',second:'2-digit'})+' · updates automatically';}
  catch(e){$('ft').textContent='Reconnecting…';}
}
function render(){
  if(!st)return;const now=Date.now()+off,W=st.windows||[],tot=st.total||0,max=st.mainCap||250;
  let cur=-1;W.forEach((w,i)=>{if(now>=w.opensAt)cur=i});
  const w=W[cur],nx=W.find(x=>x.opensAt>now),full=w&&tot>=w.cap,open=w&&!full;
  $('tot').textContent=tot;$('cap').textContent=tot>=max?(st.finalCap||275):max;$('bar').style.width=Math.min(100,tot/max*100)+'%';
  const wait=!open&&nx;$('cdCard').hidden=!wait;
  if(wait){const d=Math.max(0,nx.opensAt-now);$('h').textContent=p2(Math.floor(d/3600000));$('m').textContent=p2(Math.floor(d/60000)%60);$('s').textContent=p2(Math.floor(d/1000)%60);
    $('cdLab').textContent=nx.name.replace(' Registration','')+' opens in';if(d<1000&&Date.now()-last>3000)load();}
  $('sub').innerHTML=open?'<b>'+w.name+' is OPEN</b> · '+Math.max(0,w.cap-tot)+' places left in this round (up to '+w.cap+')'+(w.codeRequired?' · code needed':' · no code needed')
    :full&&nx?'<b>'+w.name.replace(' Registration','')+' is full</b> ('+w.cap+'). Next: '+nx.name.replace(' Registration','')+', '+fmt(nx.opensAt)
    :!w&&nx?'Registration opens '+fmt(nx.opensAt):'Registration closed';
  $('wins').innerHTML=W.map((x,i)=>'<div class="'+(i===cur&&open?'on':'')+'"><span>'+x.name.replace(' Registration','')+'</span><span>'+fmt(x.opensAt)+' · up to '+x.cap+'</span></div>').join('');
}
load();setInterval(render,1000);
let nextAt=Date.now()+20000;
(function poll(){const d=20000+Math.random()*5000;nextAt=Date.now()+d;setTimeout(()=>{if(!document.hidden)load();poll()},d)})();
setInterval(()=>{if(!last)return;const n=Math.max(0,Math.ceil((nextAt-Date.now())/1000));$('ft').textContent='Updated '+new Date(last).toLocaleTimeString('en-IN',{timeZone:'Asia/Kolkata',hour:'numeric',minute:'2-digit',second:'2-digit'})+' · auto-refresh in '+n+'s – no need to reload';},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-last>8000)load()});
</script></body></html>
